[package]
name = "mlfb-av-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
core_affinity = "0.8.3"
cpal = "0.18.1"
crossbeam = "0.8.4"
edgefirst-decoder = "0.27.0"
edgefirst-tensor = "0.27.0"
fast_image_resize = { version = "6.1.0", default-features = false, features = [
    "std"
] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
minstant = "0.1.7"
ndarray = "0.17.2"
# Avoid rc.13+ until Microsoft fixes the upstream quantization casting bug
# (CAST_F32_TO_F16) which causes instant hardware panics on runtime.
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "download-binaries",
    "copy-dylibs",
    "tls-native",
    "std",
    "ndarray"
] }
parking_lot = "0.12.5"
rfd = "0.17.2"
ringbuf = "0.5.1"
shared_memory = "0.12.4"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "ansi",
    "registry",
    "sharded-slab"
] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = [
    "dx12",
    "wgsl"
] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = [
    "metal",
    "wgsl"
] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(all(not(target_os = "windows"), not(target_vendor = "apple")))'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = [
    "vulkan",
    "wgsl"
] }
winit = { version = "0.30.13", default-features = false, features = [
    "x11",
    "wayland",
    "rwh_06"
] }

[dev-dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
dhat = "0.3.3"
hdrhistogram = "7.6.0"
loom = "0.7.2"
pollster = "1.0.1"
proptest = "1.11.0"
static_assertions = "1.1.0"

[build-dependencies]
naga = { version = "30.0.0", default-features = false, features = ["wgsl-in"] }

# =========================================================================
# DAILY DEVELOPMENT
# =========================================================================
[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
opt-level = 0

# =========================================================================
# BENCHMARKING
# =========================================================================
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

# =========================================================================
# TESTING (Integration & Stress Tests)
# =========================================================================
[profile.test]
opt-level = 2
debug = true
lto = "thin"
debug-assertions = true
overflow-checks = true

# =========================================================================
# PROFILING VIA TOOLS
# =========================================================================
[profile.profiling]
inherits = "release"
debug = true

# =========================================================================
# LOCAL PROFILING
# =========================================================================
[profile.release]
lto = "thin"

# =========================================================================
# FINAL USER DISTRIBUTION
# =========================================================================
[profile.final-release]
# no panic abort
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
