[package]
name = "ml-filtered-browser"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "io-util",
    "signal",
] }
winit = "0.30"
wgpu = { version = "30.0", default-features = false, features = [
    "dx12",
    "wgsl",
] }
raw-window-handle = "0.6.2"
pollster = "1.0.1"
ort = { version = "2.0.0-rc.12", features = ["directml"] }
ndarray = "0.17.2"
futures = "0.3.32"
tokenizers = { version = "0.23.1", default-features = false, features = [
    "onig",
] }
anyhow = "1.0.103"
bytemuck = { version = "1.25.1", features = ["derive"] }
encase = "0.12.0"
glam = { version = "0.33.2", features = ["bytemuck", "encase"] }
renderdoc = "0.12.1"
log = "0.4.33"
env_logger = "0.11.11"
libloading = "0.9.0"
chromiumoxide = { version = "0.9.1", default-features = false, features = [
    "rustls",
    "fetcher",
    "zip8",
] }
image = "0.25.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
remove_dir_all = "1.0.0"
tempfile = "3.27.0"

[dev-dependencies]
criterion = "0.8.2"
flamegraph = "0.6.13"

# =========================================================================
# DAILY DEVELOPMENT
# =========================================================================
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.build-override]
opt-level = 3

# =========================================================================
# BENCHMARKING
# =========================================================================
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

# =========================================================================
# LOCAL PROFILING / TESTING
# =========================================================================
[profile.release]
opt-level = 3
lto = "thin"
#
# =========================================================================
# FINAL USER DISTRIBUTION (Uncomment ONLY when shipping to users)
# =========================================================================
