[env]
GSTREAMER_VERSION = "1.26.1"
OPENVINO_VERSION = "2025.4.1"
CACHE_DIR = "target/cache"
DIST_DIR = "dist"
LIB_DIR = "${DIST_DIR}/lib"
BINARY_PATH = "../../target/release/hfm-player"

# ---------- Default ----------
[tasks.default]
alias = "package"

# ---------- Clean ----------
[tasks.clean]
description = "Remove distribution and cache directories"

[tasks.clean.windows]
script = [
    "if exist ${DIST_DIR} rmdir /s /q ${DIST_DIR}",
    "if exist ${CACHE_DIR} rmdir /s /q ${CACHE_DIR}"
]

[tasks.clean.linux]
script = ["rm -rf ${DIST_DIR}", "rm -rf ${CACHE_DIR}"]

[tasks.clean.mac]
script = ["rm -rf ${DIST_DIR}", "rm -rf ${CACHE_DIR}"]

# ---------- Prepare Cache ----------
[tasks.prepare-cache]
description = "Create cache directories"

[tasks.prepare-cache.windows]
script = [
    "if not exist target\\cache\\gstreamer mkdir target\\cache\\gstreamer",
    "if not exist target\\cache\\openvino mkdir target\\cache\\openvino"
]

[tasks.prepare-cache.linux]
script = ["mkdir -p ${CACHE_DIR}/gstreamer", "mkdir -p ${CACHE_DIR}/openvino"]

[tasks.prepare-cache.mac]
script = ["mkdir -p ${CACHE_DIR}/gstreamer", "mkdir -p ${CACHE_DIR}/openvino"]

# ---------- GStreamer ----------
[tasks.prepare-gstreamer]
description = "Prepare GStreamer runtime (platform-specific)"
dependencies = ["prepare-cache"]

[tasks.prepare-gstreamer.windows]
script = [
    # Download using Windows built-in PowerShell invocation via curl alternative if curl binary is missing
    "if not exist target\\cache\\gstreamer\\gstreamer-${GSTREAMER_VERSION}-msvc-x86_64.zip (",
    "  powershell -Command \"Invoke-WebRequest -Uri 'https://gstreamer.freedesktop.org/downloads/gstreamer-${GSTREAMER_VERSION}-msvc-x86_64.zip' -OutFile 'target\\cache\\gstreamer\\gstreamer-${GSTREAMER_VERSION}-msvc-x86_64.zip'\"",
    ")",
    # Extract using native PowerShell expand archive (removes dependency on unzip.exe)
    "if not exist target\\cache\\gstreamer\\extracted (",
    "  powershell -Command \"Expand-Archive -Path 'target\\cache\\gstreamer\\gstreamer-${GSTREAMER_VERSION}-msvc-x86_64.zip' -DestinationPath 'target\\cache\\gstreamer\\extracted' -Force\"",
    "  echo extracted > target\\cache\\gstreamer\\extracted\\_marker",
    ")",
    # Create lib directory safely
    "if not exist dist\\lib mkdir dist\\lib",
    # Copy all DLLs from bin/ to lib/ using standard Windows xcopy/copy
    "xcopy /y /s \"target\\cache\\gstreamer\\extracted\\*\\bin\\*.dll\" \"dist\\lib\\\"",
    # Copy the entire plugin directory using xcopy
    "xcopy /y /s /i \"target\\cache\\gstreamer\\extracted\\*\\lib\\gstreamer-1.0\" \"dist\\lib\\gstreamer-1.0\""
]

[tasks.prepare-gstreamer.linux]
script = [
    "mkdir -p ${LIB_DIR}",
    "ldd ${BINARY_PATH} | grep gstreamer | awk '{print $3}' | xargs -I {} cp {} ${LIB_DIR}/",
    "cp -r /usr/lib/x86_64-linux-gnu/gstreamer-1.0 ${LIB_DIR}/",
]

[tasks.prepare-gstreamer.mac]
script = [
    "mkdir -p ${LIB_DIR}",
    "otool -L ${BINARY_PATH} | grep gstreamer | awk '{print $1}' | xargs -I {} cp {} ${LIB_DIR}/",
    "cp -r /usr/local/lib/gstreamer-1.0 ${LIB_DIR}/",
]

# ---------- OpenVINO ----------
[tasks.prepare-openvino]
description = "Prepare OpenVINO runtime (platform-specific)"
dependencies = ["prepare-cache"]

[tasks.prepare-openvino.windows]
script = [
    # Download using the correct URL (using curl, but we can also keep PowerShell)
    "if not exist target\\cache\\openvino\\openvino_${OPENVINO_VERSION}_windows_x86_64.zip (",
    "  curl -L -o target\\cache\\openvino\\openvino_${OPENVINO_VERSION}_windows_x86_64.zip https://storage.openvinotoolkit.org/repositories/openvino/packages/${OPENVINO_VERSION}/windows/openvino_toolkit_windows_${OPENVINO_VERSION}.20426.82bbf0292c5_x86_64.zip",
    ")",
    # Extract if not already extracted
    "if not exist target\\cache\\openvino\\extracted (",
    "  powershell -Command \"Expand-Archive -Path 'target\\cache\\openvino\\openvino_${OPENVINO_VERSION}_windows_x86_64.zip' -DestinationPath 'target\\cache\\openvino\\extracted' -Force\"",
    "  echo extracted > target\\cache\\openvino\\extracted\\_marker",
    ")",
    "if not exist dist\\lib mkdir dist\\lib",
    # Copy DLLs (assuming same structure as before)
    "xcopy /y /s \"target\\cache\\openvino\\extracted\\*\\runtime\\bin\\intel64\\Release\\*.dll\" \"dist\\lib\\\""
]

[tasks.prepare-openvino.linux]
script = [
    # Download Ubuntu 22.04 build (adjust if you prefer RHEL or Ubuntu 24)
    "if [ ! -f ${CACHE_DIR}/openvino/openvino_${OPENVINO_VERSION}_linux_x86_64.tgz ]; then",
    "  curl -L -o ${CACHE_DIR}/openvino/openvino_${OPENVINO_VERSION}_linux_x86_64.tgz https://storage.openvinotoolkit.org/repositories/openvino/packages/${OPENVINO_VERSION}/ubuntu22/openvino_toolkit_ubuntu22_${OPENVINO_VERSION}.20426.82bbf0292c5_x86_64.tgz",
    "fi",
    "if [ ! -d ${CACHE_DIR}/openvino/extracted ]; then",
    "  mkdir -p ${CACHE_DIR}/openvino/extracted",
    "  tar -xzf ${CACHE_DIR}/openvino/openvino_${OPENVINO_VERSION}_linux_x86_64.tgz -C ${CACHE_DIR}/openvino/extracted",
    "  touch ${CACHE_DIR}/openvino/extracted/_marker",
    "fi",
    "mkdir -p ${LIB_DIR}",
    "cp ${CACHE_DIR}/openvino/extracted/*/runtime/lib/intel64/*.so ${LIB_DIR}/"
]

[tasks.prepare-openvino.mac]
script = [
    # Download macOS x86_64 build (adjust to arm64 if needed)
    "if [ ! -f ${CACHE_DIR}/openvino/openvino_${OPENVINO_VERSION}_macos_x86_64.tgz ]; then",
    "  curl -L -o ${CACHE_DIR}/openvino/openvino_${OPENVINO_VERSION}_macos_x86_64.tgz https://storage.openvinotoolkit.org/repositories/openvino/packages/${OPENVINO_VERSION}/macos/openvino_toolkit_macos_12_6_${OPENVINO_VERSION}.20426.82bbf0292c5_x86_64.tgz",
    "fi",
    "if [ ! -d ${CACHE_DIR}/openvino/extracted ]; then",
    "  mkdir -p ${CACHE_DIR}/openvino/extracted",
    "  tar -xzf ${CACHE_DIR}/openvino/openvino_${OPENVINO_VERSION}_macos_x86_64.tgz -C ${CACHE_DIR}/openvino/extracted",
    "  touch ${CACHE_DIR}/openvino/extracted/_marker",
    "fi",
    "mkdir -p ${LIB_DIR}",
    "cp ${CACHE_DIR}/openvino/extracted/*/runtime/lib/*.dylib ${LIB_DIR}/"
]

# ---------- Copy dependencies to dist ----------
[tasks.copy-deps]
description = "Copy all prepared dependencies to dist/"
dependencies = ["prepare-gstreamer", "prepare-openvino"]

# ---------- Build ----------
[tasks.build-release]
description = "Build the release binary with GUI feature"
command = "cargo"
args = ["build", "--release", "--features", "gui"]

# ---------- Bundle ----------
[tasks.bundle]
description = "Bundle the application and runtime into dist/"
dependencies = ["build-release", "copy-deps"]

[tasks.bundle.windows]
script = ["copy /y ..\\..\\target\\release\\hfm-player.exe dist\\"]

[tasks.bundle.linux]
script = [
    "cp ${BINARY_PATH} ${DIST_DIR}/",
    "patchelf --set-rpath '$ORIGIN/lib' ${DIST_DIR}/hfm-player"
]

[tasks.bundle.mac]
script = [
    "cp ${BINARY_PATH} ${DIST_DIR}/",
    "install_name_tool -add_rpath @executable_path/lib ${DIST_DIR}/hfm-player"
]

# ---------- Main package task ----------
[tasks.package]
description = "Full packaging pipeline: build, bundle, and prepare distribution"
dependencies = ["bundle"]

[tasks.package.windows]
script = ["echo Package ready in dist/", "dir dist"]

[tasks.package.linux]
script = ["echo 'Package ready in ${DIST_DIR}/'", "ls -la ${DIST_DIR}/"]

[tasks.package.mac]
script = ["echo 'Package ready in ${DIST_DIR}/'", "ls -la ${DIST_DIR}/"]
