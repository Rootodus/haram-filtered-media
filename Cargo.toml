[workspace]
resolver = "2"
members = [
    "crates/hfm-web",
]

[workspace.dependencies]
# --- Shared Dependencies ---
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false }
log = "0.4.34"
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.12", default-features = false }
pollster = "1.0.1"
wgpu = { version = "30.0.1", default-features = false }
winit = { version = "0.30.13", default-features = false }
# --- Unique Web Dependencies (Used only by hfm-web) ---
chromiumoxide = { version = "0.9.1", default-features = false }
encase = "0.12.1"
env_logger = "0.11.11"
futures = "0.3.34"
glam = { version = "0.33.5", default-features = false }
libloading = "0.9.0"
raw-window-handle = "0.6.2"
remove_dir_all = "1.0.0"
renderdoc = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53", default-features = false }
tokenizers = { version = "0.23.1", default-features = false }
# --- Dev and Build Tooling ---
criterion = "0.8.2"
flamegraph = "0.6.14"

# =========================================================================
# DAILY DEVELOPMENT
# =========================================================================
[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
opt-level = 0

# =========================================================================
# BENCHMARKING
# =========================================================================
[profile.bench]
lto = "fat"
codegen-units = 1

# =========================================================================
# TESTING (Integration & Stress Tests)
# =========================================================================
[profile.test]
opt-level = 1
debug = "line-tables-only"

# =========================================================================
# PROFILING VIA TOOLS
# =========================================================================
[profile.profiling]
inherits = "release"
debug = true

# =========================================================================
# LOCAL PROFILING
# =========================================================================
[profile.release]
lto = "thin"
debug = "line-tables-only"

# =========================================================================
# FINAL USER DISTRIBUTION
# =========================================================================
[profile.final-release]
# Do not use panic = "abort" because code could rely/relies on catch_unwind
inherits = "release"
lto = "fat"
debug = false
codegen-units = 1
strip = true
