[package]
name = "mlfb-av-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
core_affinity = "0.8.3"
cpal = "0.18.1"
crossbeam = "0.8.4"
fast_image_resize = "6.1.0"
minstant = "0.1.7"
ort = "2.0.0-rc.12"
parking_lot = "0.12.5"
rfd = "0.17.2"
ringbuf = "0.5.1"
shared_memory = "0.12.4"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wgpu = "30.0.0"
winit = "0.30.13"

[dev-dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
dhat = "0.3.3"
hdrhistogram = "7.6.0"
loom = "0.7.2"
pollster = "1.0.1"
proptest = "1.11.0"
static_assertions = "1.1.0"

[build-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }

# =========================================================================
# DAILY DEVELOPMENT
# =========================================================================
[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 2

# =========================================================================
# BENCHMARKING
# =========================================================================
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

# =========================================================================
# TESTING (Integration & Stress Tests)
# =========================================================================
[profile.test]
opt-level = 2
debug = true
lto = "thin"
debug-assertions = true
overflow-checks = true

# =========================================================================
# PROFILING VIA TOOLS
# =========================================================================
[profile.profiling]
inherits = "release"
debug = true

# =========================================================================
# LOCAL PROFILING
# =========================================================================
[profile.release]
lto = "thin"

# =========================================================================
# FINAL USER DISTRIBUTION
# =========================================================================
[profile.final-release]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
# no panic abort
