[package]
name = "hfm-player"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Core library
hfm-core = { path = "../hfm-core" }
# Workspace dependencies
mimalloc = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
pollster = { workspace = true }
ringbuf = { workspace = true }
cpal = { workspace = true }
# Player-specific dependencies (not used by hfm-core)
rfd = { workspace = true }
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
gstreamer-video = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
dhat = { workspace = true, optional = true }

# GPU & windowing (target-specific features)
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12", "wgsl"] }
winit = { workspace = true, features = ["rwh_06"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal", "wgsl"] }
winit = { workspace = true, features = ["rwh_06"] }

[target.'cfg(all(not(target_os = "windows"), not(target_vendor = "apple")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "wgsl"] }
winit = { workspace = true, features = ["x11", "wayland", "rwh_06"] }
