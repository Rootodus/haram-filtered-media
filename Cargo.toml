[workspace]
resolver = "2"
members = ["crates/hfm-core", "crates/hfm-web"]

[workspace.dependencies]
# --- Shared Dependencies (Used by both hfm-core and hfm-web) ---
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false }
log = "0.4.33"
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.12", default-features = false }
pollster = "1.0.1"
wgpu = { version = "30.0.0", default-features = false }
winit = { version = "0.30.13", default-features = false }
# --- Unique Core Dependencies (Used only by hfm-core) ---
core_affinity = "0.8.3"
cpal = "0.18.1"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.16"
fast_image_resize = { version = "6.1.0", default-features = false }
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.3"
minstant = "0.1.7"
mp4 = "0.14.0"
parking_lot = "0.12.5"
rav1d = { version = "1.1.0" }
rfd = "0.17.2"
ringbuf = "0.5.1"
rust_h264 = "0.4.0"
shared_memory = "0.12.4"
symphonia = { version = "0.6.0", default-features = false }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
yscv-video = "0.1.11"
# --- Unique Web Dependencies (Used only by hfm-web) ---
chromiumoxide = { version = "0.9.1", default-features = false }
encase = "0.12.0"
env_logger = "0.11.11"
futures = "0.3.34"
glam = { version = "0.33.3", default-features = false }
libloading = "0.9.0"
raw-window-handle = "0.6.2"
remove_dir_all = "1.0.0"
renderdoc = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53", default-features = false }
tokenizers = { version = "0.23.1", default-features = false }
# --- Dev and Build Tooling ---
criterion = "0.8.2"
dhat = "0.3.3"
flamegraph = "0.6.13"
hdrhistogram = "7.6.0"
loom = "0.7.2"
naga = { version = "30.0.0", default-features = false }
proptest = "1.11.0"
static_assertions = "1.1.0"

# =========================================================================
# DAILY DEVELOPMENT
# =========================================================================
[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
opt-level = 0

# == == == == == == == == == == == == == == == == == == == == == == == == == == == == == == == == == == == == =
# BENCHMARKING
# =========================================================================
[profile.bench]
lto = "fat"
codegen-units = 1

# =========================================================================
# TESTING (Integration & Stress Tests)
# =========================================================================
[profile.test]
opt-level = 1
debug = "line-tables-only"

# =========================================================================
# PROFILING VIA TOOLS
# =========================================================================
[profile.profiling]
inherits = "release"
debug = true

# =========================================================================
# LOCAL PROFILING
# =========================================================================
[profile.release]
lto = "thin"

# =========================================================================
# FINAL USER DISTRIBUTION
# =========================================================================
[profile.final-release]
# Do not use panic = "abort" because code could rely/relies on catch_unwind
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
