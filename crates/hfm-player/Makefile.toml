[env]
BINARY_PATH = "../../target/release/hfm-player"

[tasks.default]
alias = "dist"

[tasks.clean]
description = "Remove distribution and cache directories"
command = "cargo"
args = ["run", "--bin", "pack", "--", "--clean"]

[tasks.build-release]
description = "Build the release binary with GUI feature using final-release profile"
command = "cargo"
args = ["build", "--profile", "final-release", "--features", "gui"]

[tasks.run-pack]
description = "Run the pack script to bundle dependencies"
command = "cargo"
args = ["run", "--bin", "pack"]

[tasks.dist]
description = "Full packaging pipeline: build, bundle, and prepare distribution"
dependencies = ["build-release", "run-pack"]

[tasks.check-urls]
description = "Check that all dependency URLs are valid"
command = "cargo"
args = ["run", "--bin", "pack", "--", "--check-urls"]
