[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/hfm-core",
    "crates/hfm-player",
    "crates/hfm-reader",
]

[workspace.dependencies]
# --- Shared Dependencies ---
mimalloc = "0.1.52"
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.12", default-features = false }
pollster = "1.0.1"
rfd = "0.17.2"
wgpu = { version = "30.0.1", default-features = false }
winit = { version = "0.30.13", default-features = false }
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"
eframe = "0.36.1"
env_logger = "0.11.11"
serde_json = "1.0.151"
tempfile = "3.27.0"
# --- Unique Core Dependencies (Used only by hfm-core) ---
cpal = "0.18.2"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.16"
fast_image_resize = { version = "6.1.0", default-features = false }
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.3"
parking_lot = "0.12.5"
ringbuf = "0.5.1"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
# --- Dev and Build Tooling ---
criterion = "0.8.2"
dhat = "0.3.3"
flamegraph = "0.6.14"
hdrhistogram = "7.6.0"
loom = "0.7.2"
naga = { version = "30.0.1", default-features = false }
proptest = "1.11.0"
static_assertions = "1.1.0"
reqwest = "0.13.4"
zip = "8.6.0"
tar = "0.4.46"
flate2 = "1.1.9"
walkdir = "2.5.0"
windows-sys = "0.61.2"

# =========================================================================
# DAILY DEVELOPMENT
# =========================================================================
[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
opt-level = 0

# =========================================================================
# BENCHMARKING
# =========================================================================
[profile.bench]
lto = "fat"
codegen-units = 1

# =========================================================================
# TESTING (Integration & Stress Tests)
# =========================================================================
[profile.test]
opt-level = 1
debug = "line-tables-only"

# =========================================================================
# PROFILING VIA TOOLS
# =========================================================================
[profile.profiling]
inherits = "release"
debug = true

# =========================================================================
# LOCAL PROFILING
# =========================================================================
[profile.release]
lto = "thin"
debug = "line-tables-only"

# =========================================================================
# FINAL USER DISTRIBUTION
# =========================================================================
[profile.final-release]
# Do not use panic = "abort" because code could rely/relies on catch_unwind
inherits = "release"
lto = "fat"
debug = false
codegen-units = 1
strip = true
